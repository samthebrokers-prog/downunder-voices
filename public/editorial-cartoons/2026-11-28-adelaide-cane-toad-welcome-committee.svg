<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Downunder Voices Cartoon of the Day — South Australia’s least welcome hitchhiker</title>
  <desc id="desc">Black-and-white traditional newspaper cartoon at night in the Grange wetlands. An original cane toad with a tiny suitcase covered in travel stickers crouches in a spotlight beside a South Australia border sign that says declare fruit, vegetables and amphibians. Two fictional biosecurity officers approach with a humane collection container. The toad says: So the welcome committee was a trap. Caption: South Australia’s least welcome hitchhiker. Source note cites PIRSA, 27 November 2026.</desc>
  <defs>
    <pattern id="cross" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8L8 0M-2 2L2-2M6 10L10 6" stroke="#111" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#111"/><circle cx="7" cy="6" r="1" fill="#111"/>
    </pattern>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="28" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
    <clipPath id="panel"><rect x="31" y="100" width="1138" height="520"/></clipPath>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <rect x="10" y="10" width="1180" height="740" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="600" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#111" textLength="1136" lengthAdjust="spacingAndGlyphs">DOWNUNDER VOICES — CARTOON OF THE DAY</text>
  <line x1="31" y1="90" x2="1169" y2="90" stroke="#111" stroke-width="3"/>

  <g clip-path="url(#panel)" filter="url(#rough)" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <rect x="31" y="100" width="1138" height="520" fill="#fff" stroke-width="2.5"/>
    <!-- night sky and moon -->
    <path d="M31 100H1169V335Q1080 320 990 333T810 326T625 338T440 329T250 340T31 325Z" fill="url(#dots)" stroke="none" opacity=".72"/>
    <circle cx="1050" cy="168" r="48" fill="#fff" stroke-width="2.5"/>
    <path d="M1025 152q18-18 35-1M1044 183q15-11 27 1" fill="none" stroke-width="1.3" opacity=".7"/>
    <path d="M75 162l14 4-14 4 4 14-10-11-10 11 4-14-14-4 14-4-4-14 10 11 10-11z" fill="#fff" stroke-width="1.2"/>
    <path d="M188 128l10 3-10 3 3 10-7-8-7 8 3-10-10-3 10-3-3-10 7 8 7-8z" fill="#fff" stroke-width="1"/>
    <path d="M760 150l9 3-9 3 3 9-7-7-7 7 3-9-9-3 9-3-3-9 7 7 7-7z" fill="#fff" stroke-width="1"/>

    <!-- distant Adelaide/wetland silhouette -->
    <path d="M31 310q45-24 88 0t87 0q52-36 105 0t110 0q60-28 120 0t110 0q66-32 130 0t114 0q55-25 104 0t90 0v103H31z" fill="#fff" stroke-width="2.5"/>
    <path d="M55 321q12-70 24 0M74 321q10-96 20 0M104 321q14-82 28 0M1010 321q12-88 24 0M1040 321q12-112 24 0M1070 321q14-78 28 0" fill="none" stroke-width="2"/>
    <path d="M36 352q90-25 176 0t175 0 175 0 175 0 175 0 182 0" fill="none" stroke-width="2"/>
    <path d="M31 371q80-18 160 0t160 0 160 0 160 0 160 0 178 0" fill="none" stroke-width="1.2"/>
    <path d="M31 413q140-26 272 0t272 0 272 0 322 0v207H31z" fill="url(#cross)" opacity=".35" stroke-width="2"/>
    <path d="M31 430q120-18 240 0t240 0 240 0 240 0 178 0" fill="none" stroke-width="2"/>
    <path d="M55 520q60-40 115-12t110-4M890 515q72-42 130-8t115-3" fill="none" stroke-width="2.2"/>

    <!-- border/biosecurity sign -->
    <path d="M118 219L318 205 326 421 126 433Z" fill="#fff" stroke-width="4"/>
    <path d="M142 238L296 228 302 401 148 410Z" fill="none" stroke-width="2"/>
    <text x="221" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" transform="rotate(-4 221 267)">SOUTH AUSTRALIA</text>
    <path d="M157 279L290 270" fill="none" stroke-width="2"/>
    <text x="222" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" transform="rotate(-4 222 304)">DECLARE</text>
    <text x="223" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" transform="rotate(-4 223 330)">FRUIT • VEGETABLES</text>
    <text x="225" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" transform="rotate(-4 225 354)">AND AMPHIBIANS</text>
    <path d="M176 380q24-22 48 0t48 0" fill="none" stroke-width="2"/>
    <path d="M172 431l-6 137M286 424l8 144" fill="none" stroke-width="8"/>
    <path d="M167 568l-22 28M294 568l24 28" fill="none" stroke-width="5"/>

    <!-- spotlight beams -->
    <path d="M914 245L563 389 715 603 1010 294Z" fill="#fff" opacity=".82" stroke="none"/>
    <path d="M914 245L563 389M1010 294L715 603" fill="none" stroke-width="1.6" stroke-dasharray="10 8"/>

    <!-- cane toad, wholly original -->
    <ellipse cx="592" cy="566" rx="128" ry="20" fill="#fff" stroke-width="1.8"/>
    <path d="M480 542q-26-43 5-82 22-28 66-31 28-46 83-17 17 9 25 28 54 4 71 42 18 41-12 67-23 20-69 18-25 13-54 6-31 8-55-7-39 3-60-24z" fill="#fff" stroke-width="4"/>
    <path d="M505 479q-9-35 22-49 31-14 57 12M621 441q21-30 55-10 28 17 12 49" fill="#fff" stroke-width="3"/>
    <ellipse cx="544" cy="456" rx="18" ry="15" fill="#fff" stroke-width="2.5"/><ellipse cx="663" cy="456" rx="18" ry="15" fill="#fff" stroke-width="2.5"/>
    <circle cx="548" cy="458" r="5" fill="#111"/><circle cx="659" cy="458" r="5" fill="#111"/>
    <path d="M548 507q45 25 90 0M590 511q8 10 16 0" fill="none" stroke-width="3"/>
    <path d="M490 524q-37 7-50 35 44-11 77-2M692 529q42 4 59 31-48-8-82-1" fill="#fff" stroke-width="3"/>
    <!-- warty texture -->
    <g fill="#fff" stroke-width="1.5">
      <circle cx="523" cy="492" r="7"/><circle cx="558" cy="480" r="5"/><circle cx="588" cy="463" r="6"/><circle cx="620" cy="481" r="5"/><circle cx="656" cy="494" r="7"/>
      <circle cx="543" cy="526" r="6"/><circle cx="579" cy="540" r="5"/><circle cx="620" cy="530" r="7"/><circle cx="664" cy="525" r="5"/>
    </g>

    <!-- tiny travel suitcase -->
    <rect x="392" y="475" width="95" height="80" rx="7" fill="#fff" stroke-width="3.5"/>
    <path d="M419 475v-17q0-12 13-12h16q13 0 13 12v17M406 491h67M413 475v80M468 475v80" fill="none" stroke-width="2.2"/>
    <circle cx="414" cy="563" r="6" fill="#fff" stroke-width="2"/><circle cx="466" cy="563" r="6" fill="#fff" stroke-width="2"/>
    <text x="441" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" transform="rotate(-6 441 518)">QLD</text>
    <text x="440" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" transform="rotate(5 440 541)">HITCHHIKER</text>

    <!-- speech balloon -->
    <path d="M374 150q0-34 40-34h337q40 0 40 34v105q0 34-40 34H570l-63 61 18-61H414q-40 0-40-34z" fill="#fff" stroke-width="3.5"/>
    <text x="582" y="174" text-anchor="middle" font-family="Georgia, serif" font-size="27" font-weight="700">“SO THE WELCOME</text>
    <text x="582" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="27" font-weight="700">COMMITTEE WAS A TRAP.”</text>
    <text x="582" y="247" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic">— one very confused hitchhiker</text>

    <!-- fictional biosecurity officers -->
    <g fill="#fff" stroke-width="3">
      <circle cx="928" cy="352" r="35"/><path d="M892 348q35-40 72 0z"/><path d="M906 312q23-17 45 0l10 16h-66z"/>
      <path d="M887 398q40-30 82 0l18 135-108 3z"/>
      <path d="M907 397l20 28 22-28M927 425v107" fill="none"/>
      <path d="M890 417q-47 20-76 71M969 418q34 18 58 51" fill="none" stroke-width="12"/>
      <path d="M814 488l-34 24M1027 469l27 28" fill="none" stroke-width="8"/>
      <path d="M895 535l-10 71M960 534l16 72" fill="none" stroke-width="14"/>
    </g>
    <path d="M910 454h38v28h-38z" fill="#fff" stroke-width="2"/><text x="929" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700">PIRSA</text>
    <!-- spotlight and collection box -->
    <path d="M790 475l31-22 18 26-31 22z" fill="#fff" stroke-width="3"/><path d="M787 493L721 545" fill="none" stroke-width="5"/>
    <path d="M1014 492h113v77h-113z" fill="#fff" stroke-width="3"/>
    <path d="M1025 505h91v39h-91z" fill="url(#dots)" opacity=".4" stroke-width="1.5"/>
    <text x="1070" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700">BIOSECURITY</text>
  </g>

  <rect x="31" y="633" width="1138" height="61" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="600" y="674" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="700">SOUTH AUSTRALIA’S LEAST WELCOME HITCHHIKER</text>
  <rect x="31" y="703" width="102" height="29" fill="#111"/>
  <text x="82" y="724" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">SATIRE</text>
  <text x="148" y="723" font-family="Arial, sans-serif" font-size="16" fill="#111">Source: PIRSA, 27 Nov 2026 — cane toad found and removed from Grange wetlands overnight.</text>
</svg>
