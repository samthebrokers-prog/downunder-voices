  <text x="932" y="369" text-anchor="middle" font-family="Georgia,'DejaVu Serif',serif" font-size="18" font-weight="700">“NEXT LESSON: LOOKING BUSY</text>
  <text x="932" y="396" text-anchor="middle" font-family="Georgia,'DejaVu Serif',serif" font-size="18" font-weight="700">WHILE SITTING IN THE SUN.”</text>

  <text x="600" y="680" text-anchor="middle" font-family="Georgia,'DejaVu Serif',serif" font-size="34" font-weight="700">CASSIE’S FIRST WEEK AT THE BRANCH OFFICE.</text>
  <text x="600" y="718" text-anchor="middle" font-family="Georgia,'DejaVu Serif',serif" font-size="14"><tspan font-weight="700">Source:</tspan> ABC BTN, 24 November 2026 — Cassie is building climbing, balancing and gripping skills at Monarto Safari Park.</text>
  <text x="1156" y="727" text-anchor="end" font-family="Georgia,'DejaVu Serif',serif" font-size="21" font-weight="700">DV</text>
